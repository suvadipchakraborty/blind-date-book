name = "blind-date-book"
main = "src/worker.js"
compatibility_date = "2024-09-23"

# Static assets (public/index.html, css, js, manifest, icons) are served
# straight from the Worker via the ASSETS binding — see src/worker.js.
[assets]
directory = "public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[observability]
enabled = true
